<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROTARY TANK 16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #07090e;
            color: #fff;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        .pixel-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .scanlines {
            position: relative;
        }
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .retro-btn {
            background: linear-gradient(180deg, #4a5568 0%, #1a202c 100%);
            border: 4px solid #718096;
            border-radius: 8px;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.3), 0 4px 0 #000;
            text-shadow: 2px 2px #000;
        }
        .retro-btn:active, .retro-btn.pressed {
            transform: translateY(4px);
            box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.4), 0 0 0 #000;
        }

        .retro-btn-green {
            background: linear-gradient(180deg, #38a169 0%, #1c4532 100%);
            border-color: #48bb78;
        }
        .retro-btn-red {
            background: linear-gradient(180deg, #e53e3e 0%, #742a2a 100%);
            border-color: #f56565;
        }
        .retro-btn-yellow {
            background: linear-gradient(180deg, #d69e2e 0%, #744210 100%);
            border-color: #ecc94b;
        }
        .retro-btn-purple {
            background: linear-gradient(180deg, #805ad5 0%, #442a74 100%);
            border-color: #b794f4;
        }

        #touch-joystick-base {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(45, 55, 72, 0.6) 0%, rgba(26, 32, 44, 0.8) 100%);
            border: 3px solid rgba(113, 128, 150, 0.8);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 50;
            display: none;
        }
        #touch-joystick-knob {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(160, 174, 192, 0.9) 0%, rgba(74, 85, 104, 0.9) 100%);
            border: 2px solid rgba(203, 213, 224, 0.9);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .ex-mode-active #hud {
            border-color: #9f7aea;
            background-color: #1a0933;
        }
        .ex-mode-active #game-container {
            border-color: #6b46c1;
        }
    </style>
</head>
<body id="main-body" class="flex flex-col items-center justify-between h-screen w-screen overflow-hidden bg-slate-950 p-2 select-none">

    <div id="hud" class="w-full max-w-md bg-slate-900 border-4 border-slate-700 rounded-lg px-2 py-1.5 flex justify-between items-center text-xs text-yellow-400 z-20 shadow-lg gap-1 transition-colors duration-300">
        <div class="flex flex-col">
            <span id="hud-mode-label" class="text-[7px] text-gray-400">NORMAL MODE</span>
            <span id="hud-stage" class="text-xs font-bold text-white">01 / 32</span>
        </div>
        <div class="flex flex-col items-center">
            <span class="text-[8px] text-gray-400">DEATHS</span>
            <span id="hud-deaths" class="text-xs font-bold text-red-400">0</span>
        </div>
        <div class="flex flex-col items-center">
            <span class="text-[8px] text-gray-400">TIME</span>
            <span id="hud-time" class="text-xs font-bold text-cyan-300">00:00</span>
        </div>
        <div class="flex flex-col items-center w-20">
            <span id="hud-shot-label" class="text-[8px] text-gray-400">SHOT (3s)</span>
            <div class="w-full bg-slate-800 border border-slate-600 h-2 rounded-full overflow-hidden mt-0.5">
                <div id="shot-bar" class="bg-red-500 h-full w-0 transition-all duration-75"></div>
            </div>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-[8px] text-gray-400">ENEMIES</span>
            <span id="hud-enemies" class="text-xs font-bold text-red-400">0</span>
        </div>
    </div>

    <div id="game-container" class="relative w-full max-w-md aspect-square my-auto bg-black rounded-lg border-4 border-slate-800 overflow-hidden shadow-2xl scanlines transition-colors duration-300">
        <canvas id="gameCanvas" class="w-full h-full pixel-art block"></canvas>

        <div id="touch-joystick-base">
            <div id="touch-joystick-knob"></div>
        </div>

        <!-- TITLE OVERLAY -->
        <div id="title-overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-4 z-30 text-center">
            <h1 id="title-main" class="text-2xl font-black text-yellow-400 tracking-wider mb-1 leading-tight drop-shadow-[0_4px_0_rgba(0,0,0,1)]">
                ROTARY TANK<br><span id="title-sub" class="text-red-500 text-3xl">16</span>
            </h1>
            <p id="title-tagline" class="text-[9px] text-cyan-300 mb-3 tracking-widest">SFC 16-BIT RETRO ACTION</p>
            <p id="title-desc" class="text-[8px] text-gray-300 mb-4 leading-relaxed max-w-xs">
                画面内どこでもタッチ＆スライド操作！<br>
                自動砲塔回転＆自動発射のクセを見極めよ！
            </p>

            <div id="mode-selector" class="flex gap-2 mb-3 hidden">
                <button id="btn-select-normal" class="retro-btn retro-btn-green px-3 py-1.5 text-[9px] font-bold text-white">NORMAL</button>
                <button id="btn-select-ex" class="retro-btn retro-btn-purple px-3 py-1.5 text-[9px] font-bold text-white">EX MODE (裏面)</button>
            </div>

            <button id="btn-start" class="retro-btn retro-btn-green px-6 py-2.5 text-xs font-bold text-white mb-2 w-48">
                GAME START
            </button>
            <button id="btn-stage-select-menu" class="retro-btn retro-btn-yellow px-5 py-2 text-[10px] font-bold text-white mb-2 w-48">
                STAGE SELECT
            </button>
            <button id="btn-sound-toggle" class="retro-btn px-4 py-1 text-[9px] text-gray-300 w-48">
                SOUND: ON
            </button>
        </div>

        <!-- STAGE SELECT OVERLAY -->
        <div id="stage-overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-start p-3 z-30 hidden">
            <h2 id="stage-select-title" class="text-xs font-bold text-yellow-400 mb-2">SELECT STAGE (1-32)</h2>
            <div id="stage-grid" class="grid grid-cols-4 gap-1.5 w-full max-h-72 overflow-y-auto p-1 mb-3"></div>
            <button id="btn-stage-back" class="retro-btn retro-btn-red px-6 py-2 text-[10px] font-bold text-white">
                BACK
            </button>
        </div>

        <!-- MESSAGE OVERLAY -->
        <div id="message-overlay" class="absolute inset-0 bg-slate-950/85 flex flex-col items-center justify-center p-4 z-30 hidden text-center">
            <h2 id="msg-title" class="text-lg font-bold text-yellow-400 mb-1">STAGE CLEAR</h2>
            <p id="msg-desc" class="text-[9px] text-gray-300 mb-2">ALL ENEMIES DESTROYED</p>
            <div id="msg-stats" class="text-[9px] text-cyan-300 mb-4 space-y-1 bg-slate-900/80 p-2 rounded border border-slate-700 w-48 hidden">
                <div>TIME: <span id="stat-time" class="text-white">00:00</span></div>
                <div>DEATHS: <span id="stat-deaths" class="text-red-400">0</span></div>
            </div>
            <button id="msg-btn" class="retro-btn retro-btn-green px-6 py-3 text-[10px] font-bold text-white w-40">
                NEXT STAGE
            </button>
        </div>
    </div>

    <div id="mobile-controls" class="w-full max-w-md flex justify-around items-center px-4 py-1.5 bg-slate-900/90 rounded-xl border-2 border-slate-800 z-20">
        <span class="text-[8px] text-gray-400">TOUCH ANYWHERE TO MOVE</span>
        <div class="flex gap-2">
            <button id="btn-pause" class="retro-btn retro-btn-yellow px-3 py-1.5 text-[9px] font-bold text-white">PAUSE</button>
            <button id="btn-restart" class="retro-btn retro-btn-red px-3 py-1.5 text-[9px] font-bold text-white">RESTART</button>
        </div>
    </div>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.bgmTimer = null;
                this.bgmStep = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playShoot() {
                if (this.muted || !this.ctx) return;
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(isEXMode ? 580 : 440, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch(e) {}
            }

            playBounce() {
                if (this.muted || !this.ctx) return;
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } catch(e) {}
            }

            playExplode() {
                if (this.muted || !this.ctx) return;
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const bufferSize = this.ctx.sampleRate * 0.3;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, now);
                    filter.frequency.linearRampToValueAtTime(50, now + 0.3);
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    whiteNoise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    whiteNoise.start(now);
                    whiteNoise.stop(now + 0.3);
                } catch(e) {}
            }

            playClear() {
                if (this.muted || !this.ctx) return;
                this.init();
                const notes = isEXMode 
                    ? [329.63, 392.00, 493.88, 659.25, 783.99, 987.77]
                    : [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        if (this.muted || !this.ctx) return;
                        try {
                            const now = this.ctx.currentTime;
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(freq, now);
                            gain.gain.setValueAtTime(0.12, now);
                            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.2);
                        } catch(e) {}
                    }, index * 90);
                });
            }

            startBGM() {
                this.init();
                this.stopBGM();
                const normalBass = [110, 110, 130.81, 146.83, 110, 110, 98, 87.31];
                const exBass = [146.83, 130.81, 110, 130.81, 146.83, 164.81, 146.83, 123.47];
                this.bgmStep = 0;
                this.bgmTimer = setInterval(() => {
                    if (this.muted || !this.ctx) return;
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    try {
                        const now = this.ctx.currentTime;
                        const notes = isEXMode ? exBass : normalBass;
                        const freq = notes[this.bgmStep % notes.length];
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = isEXMode ? 'sawtooth' : 'triangle';
                        osc.frequency.setValueAtTime(freq, now);
                        gain.gain.setValueAtTime(0.06, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.18);
                        this.bgmStep++;
                    } catch(e) {}
                }, isEXMode ? 160 : 200);
            }

            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
        }

        const audio = new SoundEngine();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 10;
        let tileSize = 32;

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const size = container.clientWidth;
            canvas.width = size;
            canvas.height = size;
            tileSize = size / GRID_SIZE;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const TILE = {
            EMPTY: 0,
            WALL_PERMANENT: 1,
            BLOCK_DESTRUCT: 2,
            ICE: 3
        };

        let gameState = 'TITLE';
        let currentStage = 1;
        let maxUnlockedStageNormal = 1;
        let maxUnlockedStageEX = 1;
        let isEXMode = false;
        let exUnlocked = localStorage.getItem('rotary_tank_ex_unlocked') === 'true';

        let totalDeaths = 0;
        let currentStageTime = 0;
        let totalPlayTime = 0;
        let stageLoading = false;

        let gridMap = [];
        let player = {
            x: 0, y: 0,
            radius: 12,
            speed: 3.5,
            angle: 0,
            turretRotSpeed: Math.PI * 0.75,
            shootCooldown: 3.0,
            bulletMaxLife: 5.0,
            shootTimer: 0,
            vx: 0, vy: 0,
            alive: true
        };

        let enemies = [];
        let bullets = [];
        let particles = [];

        const keys = { up: false, down: false, left: false, right: false };
        let joystickVector = { x: 0, y: 0 };

        function setEXMode(ex) {
            isEXMode = ex;
            const body = document.getElementById('main-body');
            const titleSub = document.getElementById('title-sub');
            const modeLabel = document.getElementById('hud-mode-label');

            if (isEXMode) {
                body.classList.add('ex-mode-active');
                titleSub.innerText = 'EX 10';
                modeLabel.innerText = 'EX MODE (裏面)';
                player.turretRotSpeed = -Math.PI * 0.85;
                player.shootCooldown = 2.0;
                player.bulletMaxLife = 7.0;
            } else {
                body.classList.remove('ex-mode-active');
                titleSub.innerText = '16';
                modeLabel.innerText = 'NORMAL MODE';
                player.turretRotSpeed = Math.PI * 0.75;
                player.shootCooldown = 3.0;
                player.bulletMaxLife = 5.0;
            }
            buildStageSelectMenu();
        }

        if (exUnlocked) {
            document.getElementById('mode-selector').classList.remove('hidden');
        }

        function generateStageLayout(stageNum) {
            const map = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                const row = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (r === 0 || r === GRID_SIZE - 1 || c === 0 || c === GRID_SIZE - 1) {
                        row.push(TILE.WALL_PERMANENT);
                    } else if (r % 3 === 0 && c % 3 === 0) {
                        row.push(TILE.WALL_PERMANENT);
                    } else {
                        const seed = (stageNum * 17 + r * 11 + c * 5) % 100;
                        if (seed < (10 + stageNum * 0.1)) {
                            row.push(TILE.BLOCK_DESTRUCT);
                        } else if (stageNum >= 9 && seed < (14 + stageNum * 0.1)) {
                            row.push(TILE.ICE);
                        } else {
                            row.push(TILE.EMPTY);
                        }
                    }
                }
                map.push(row);
            }

            for (let r = GRID_SIZE - 3; r <= GRID_SIZE - 2; r++) {
                for (let c = 1; c <= 2; c++) {
                    map[r][c] = TILE.EMPTY;
                }
            }
            return map;
        }

        function createStageEnemies(stageNum) {
            const list = [];
            const count = Math.min(1, Math.floor(stageNum / 5) + 1) + (isEXMode ? 1 : 0);
            
            const candidateSpots = [
                { r: 2, c: 2 }, { r: 2, c: GRID_SIZE - 3 },
                { r: Math.floor(GRID_SIZE / 2), c: Math.floor(GRID_SIZE / 2) }
            ];

            for (let i = 0; i < count; i++) {
                const spot = candidateSpots[i % candidateSpots.length];
                
                gridMap[spot.r][spot.c] = TILE.EMPTY;
                if (spot.r + 1 < GRID_SIZE - 1) gridMap[spot.r + 1][spot.c] = TILE.EMPTY;
                if (spot.c + 1 < GRID_SIZE - 1) gridMap[spot.r][spot.c + 1] = TILE.EMPTY;

                const isBoss = (stageNum % 8 === 0) && (i === 0);
                list.push({
                    x: (spot.c + 0.5) * tileSize,
                    y: (spot.r + 0.5) * tileSize,
                    radius: isBoss ? 16 : 12,
                    speed: isBoss ? 1.1 : (1.5 + stageNum * 0.03),
                    turretAngle: Math.random() * Math.PI * 2,
                    turretRotSpeed: (Math.random() - 0.5) * 2.0,
                    shootCooldown: isBoss ? 2.0 : Math.max(1.5, 3.5 - stageNum * 0.05),
                    shootTimer: Math.random() * 2,
                    hp: isBoss ? 4 : (1 + Math.floor(stageNum / 12)),
                    color: isBoss ? '#9333ea' : (isEXMode ? '#dc2626' : '#d97706'),
                    changeDirTimer: 0,
                    vx: 0, vy: 0,
                    isBoss: isBoss
                });
            }
            return list;
        }

        function loadStage(stageNum) {
            stageLoading = true;
            currentStage = stageNum;
            gridMap = generateStageLayout(stageNum);

            bullets = [];
            particles = [];
            enemies = createStageEnemies(stageNum);

            player.x = 1.5 * tileSize;
            player.y = (GRID_SIZE - 1.5) * tileSize;
            player.vx = 0;
            player.vy = 0;
            player.shootTimer = 0;
            player.alive = true;

            currentStageTime = 0;

            document.getElementById('hud-stage').innerText = `${String(stageNum).padStart(2, '0')} / 32`;
            updateHUDEnemies();
            updateHUDDeaths();
            updateHUDTime();

            setTimeout(() => {
                stageLoading = false;
            }, 300);
        }

        function updateHUDEnemies() {
            document.getElementById('hud-enemies').innerText = enemies.length;
        }

        function updateHUDDeaths() {
            document.getElementById('hud-deaths').innerText = totalDeaths;
        }

        function updateHUDTime() {
            document.getElementById('hud-time').innerText = formatTime(currentStageTime);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function showOverlay(id) {
            hideAllOverlays();
            document.getElementById(id).classList.remove('hidden');
        }

        function hideAllOverlays() {
            document.getElementById('title-overlay').classList.add('hidden');
            document.getElementById('stage-overlay').classList.add('hidden');
            document.getElementById('message-overlay').classList.add('hidden');
        }

        function showOverlayWithMessage(title, desc, btnText, callback, stats = null) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            const btn = document.getElementById('msg-btn');
            btn.innerText = btnText;
            btn.onclick = callback;

            const statsDiv = document.getElementById('msg-stats');
            if (stats) {
                document.getElementById('stat-time').innerText = stats.time;
                document.getElementById('stat-deaths').innerText = stats.deaths;
                statsDiv.classList.remove('hidden');
            } else {
                statsDiv.classList.add('hidden');
            }
            showOverlay('message-overlay');
        }

        function buildStageSelectMenu() {
            const grid = document.getElementById('stage-grid');
            grid.innerHTML = '';
            const maxUnlocked = isEXMode ? maxUnlockedStageEX : maxUnlockedStageNormal;

            for (let i = 1; i <= 32; i++) {
                const btn = document.createElement('button');
                btn.className = `retro-btn py-2 text-[10px] font-bold ${i <= maxUnlocked ? (isEXMode ? 'retro-btn-purple' : 'retro-btn-green') : 'opacity-50 bg-slate-800'}`;
                btn.innerText = i;
                if (i <= maxUnlocked) {
                    btn.onclick = () => {
                        audio.init();
                        audio.startBGM();
                        loadStage(i);
                        gameState = 'PLAYING';
                        hideAllOverlays();
                    };
                }
                grid.appendChild(btn);
            }
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;

            currentStageTime += dt;
            totalPlayTime += dt;
            updateHUDTime();

            let dx = 0;
            let dy = 0;

            if (keys.up) dy -= 1;
            if (keys.down) dy += 1;
            if (keys.left) dx -= 1;
            if (keys.right) dx += 1;

            if (dx !== 0 || dy !== 0) {
                const length = Math.hypot(dx, dy);
                dx /= length;
                dy /= length;
            } else {
                dx = joystickVector.x;
                dy = joystickVector.y;
            }

            const moveSpeed = player.speed * tileSize;
            player.vx = dx * moveSpeed;
            player.vy = dy * moveSpeed;

            moveAndCollide(player, dt);

            player.angle += player.turretRotSpeed * dt;

            player.shootTimer += dt;
            const shotPct = Math.min(100, (player.shootTimer / player.shootCooldown) * 100);
            document.getElementById('shot-bar').style.width = `${shotPct}%`;

            if (player.shootTimer >= player.shootCooldown) {
                player.shootTimer = 0;
                fireBullet(player.x, player.y, player.angle, true);
            }

            enemies.forEach(enemy => {
                enemy.turretAngle += enemy.turretRotSpeed * dt;
                enemy.changeDirTimer -= dt;

                if (enemy.changeDirTimer <= 0) {
                    enemy.changeDirTimer = 0.8 + Math.random() * 1.5;
                    const angles = [0, Math.PI / 2, Math.PI, -Math.PI / 2, Math.PI / 4, 3 * Math.PI / 4];
                    
                    let bestAngle = angles[Math.floor(Math.random() * angles.length)];
                    let maxSafetyScore = -999;

                    angles.forEach(ang => {
                        const testX = enemy.x + Math.cos(ang) * tileSize;
                        const testY = enemy.y + Math.sin(ang) * tileSize;
                        
                        let safetyScore = 0;
                        bullets.forEach(b => {
                            const dist = Math.hypot(b.x - testX, b.y - testY);
                            if (dist < tileSize * 2.5) safetyScore -= (tileSize * 2.5 - dist);
                        });

                        const frontX = testX + Math.cos(enemy.turretAngle) * (tileSize * 1.0);
                        const frontY = testY + Math.sin(enemy.turretAngle) * (tileSize * 1.0);
                        if (checkTileCollision(frontX, frontY, 4)) {
                            safetyScore -= 100;
                        }

                        if (safetyScore > maxSafetyScore) {
                            maxSafetyScore = safetyScore;
                            bestAngle = ang;
                        }
                    });

                    enemy.vx = Math.cos(bestAngle) * enemy.speed * tileSize * 0.7;
                    enemy.vy = Math.sin(bestAngle) * enemy.speed * tileSize * 0.7;
                }
                moveAndCollide(enemy, dt);

                enemy.shootTimer += dt;
                if (enemy.shootTimer >= enemy.shootCooldown) {
                    const frontX = enemy.x + Math.cos(enemy.turretAngle) * (tileSize * 1.1);
                    const frontY = enemy.y + Math.sin(enemy.turretAngle) * (tileSize * 1.1);
                    const isFacingWall = checkTileCollision(frontX, frontY, 4);

                    if (!isFacingWall) {
                        enemy.shootTimer = 0;
                        fireBullet(enemy.x, enemy.y, enemy.turretAngle, false);
                    }
                }
            });

            updateBullets(dt);

            particles.forEach(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
            });
            particles = particles.filter(p => p.life > 0);

            if (!player.alive) {
                totalDeaths++;
                updateHUDDeaths();
                gameState = 'GAME_OVER';
                showOverlayWithMessage('GAME OVER', 'YOUR TANK WAS DESTROYED', 'RETRY', () => {
                    loadStage(currentStage);
                    gameState = 'PLAYING';
                    audio.startBGM();
                    hideAllOverlays();
                }, {
                    time: formatTime(currentStageTime),
                    deaths: totalDeaths
                });
            } else if (!stageLoading && enemies.length === 0) {
                audio.playClear();
                if (currentStage >= 32) {
                    if (!isEXMode) {
                        exUnlocked = true;
                        localStorage.setItem('rotary_tank_ex_unlocked', 'true');
                        document.getElementById('mode-selector').classList.remove('hidden');

                        gameState = 'STAGE_CLEAR';
                        showOverlayWithMessage('VICTORY!', 'CONGRATULATIONS! ALL 32 STAGES CLEARED!\nEX MODE (裏面) UNLOCKED!', 'TITLE MENU', () => {
                            gameState = 'TITLE';
                            audio.stopBGM();
                            showOverlay('title-overlay');
                        }, {
                            time: formatTime(totalPlayTime),
                            deaths: totalDeaths
                        });
                    } else {
                        gameState = 'STAGE_CLEAR';
                        showOverlayWithMessage('EX VICTORY!', 'ALL EX STAGES COMPLETED! YOU ARE A MASTER!', 'TITLE MENU', () => {
                            gameState = 'TITLE';
                            audio.stopBGM();
                            showOverlay('title-overlay');
                        }, {
                            time: formatTime(totalPlayTime),
                            deaths: totalDeaths
                        });
                    }
                } else {
                    gameState = 'STAGE_CLEAR';
                    if (!isEXMode) {
                        if (currentStage === maxUnlockedStageNormal) maxUnlockedStageNormal++;
                    } else {
                        if (currentStage === maxUnlockedStageEX) maxUnlockedStageEX++;
                    }
                    buildStageSelectMenu();
                    showOverlayWithMessage(`STAGE ${currentStage} CLEAR!`, 'ALL ENEMIES DESTROYED', 'NEXT STAGE', () => {
                        currentStage++;
                        loadStage(currentStage);
                        gameState = 'PLAYING';
                        audio.startBGM();
                        hideAllOverlays();
                    }, {
                        time: formatTime(currentStageTime),
                        deaths: totalDeaths
                    });
                }
            }
        }

        function moveAndCollide(entity, dt) {
            let nextX = entity.x + entity.vx * dt;
            let nextY = entity.y + entity.vy * dt;

            if (!checkTileCollision(nextX, entity.y, entity.radius)) {
                entity.x = nextX;
            }
            if (!checkTileCollision(entity.x, nextY, entity.radius)) {
                entity.y = nextY;
            }
        }

        function checkTileCollision(x, y, radius) {
            const minCol = Math.floor((x - radius) / tileSize);
            const maxCol = Math.floor((x + radius) / tileSize);
            const minRow = Math.floor((y - radius) / tileSize);
            const maxRow = Math.floor((y + radius) / tileSize);

            for (let r = minRow; r <= maxRow; r++) {
                for (let c = minCol; c <= maxCol; c++) {
                    if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) {
                        const tile = gridMap[r][c];
                        if (tile === TILE.WALL_PERMANENT || tile === TILE.BLOCK_DESTRUCT) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function fireBullet(x, y, angle, isPlayer) {
            const speed = tileSize * 4.5;
            bullets.push({
                x: x + Math.cos(angle) * (tileSize * 0.4),
                y: y + Math.sin(angle) * (tileSize * 0.4),
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 4,
                isPlayer: isPlayer,
                lifeTimer: 0,
                maxLife: isPlayer ? player.bulletMaxLife : 5.0,
                bounceCooldown: 0
            });
            audio.playShoot();
        }

        function updateBullets(dt) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.lifeTimer += dt;
                if (b.bounceCooldown > 0) {
                    b.bounceCooldown -= dt;
                }

                if (b.lifeTimer >= b.maxLife) {
                    explodeBullet(b, i);
                    continue;
                }

                let nextX = b.x + b.vx * dt;
                let nextY = b.y + b.vy * dt;

                const col = Math.floor(nextX / tileSize);
                const row = Math.floor(nextY / tileSize);

                if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
                    const tile = gridMap[row][col];

                    if (tile === TILE.BLOCK_DESTRUCT) {
                        gridMap[row][col] = TILE.EMPTY;
                        explodeBullet(b, i);
                        continue;
                    } else if (tile === TILE.WALL_PERMANENT) {
                        if (b.bounceCooldown <= 0) {
                            audio.playBounce();
                            const prevCol = Math.floor(b.x / tileSize);
                            const prevRow = Math.floor(b.y / tileSize);

                            if (prevCol !== col) b.vx = -b.vx;
                            if (prevRow !== row) b.vy = -b.vy;

                            b.bounceCooldown = 0.08;
                            createParticles(b.x, b.y, '#ffffff', 3);
                        }
                        
                        nextX = b.x + b.vx * dt;
                        nextY = b.y + b.vy * dt;
                    }
                }

                if (b.isPlayer) {
                    let hitEnemyIndex = -1;
                    for (let eIdx = 0; eIdx < enemies.length; eIdx++) {
                        const enemy = enemies[eIdx];
                        if (Math.hypot(nextX - enemy.x, nextY - enemy.y) < enemy.radius + b.radius) {
                            hitEnemyIndex = eIdx;
                            break;
                        }
                    }

                    if (hitEnemyIndex !== -1) {
                        const enemy = enemies[hitEnemyIndex];
                        enemy.hp--;
                        explodeBullet(b, i);

                        if (enemy.hp <= 0) {
                            createParticles(enemy.x, enemy.y, '#e53e3e', 14);
                            enemies.splice(hitEnemyIndex, 1);
                            updateHUDEnemies();
                        }
                        continue;
                    }
                } else {
                    if (Math.hypot(nextX - player.x, nextY - player.y) < player.radius + b.radius) {
                        player.alive = false;
                        explodeBullet(b, i);
                        continue;
                    }
                }

                b.x = nextX;
                b.y = nextY;
            }
        }

        function explodeBullet(bullet, index) {
            audio.playExplode();
            createParticles(bullet.x, bullet.y, isEXMode ? '#c084fc' : '#f6ad55', 10);
            
            const splashRadius = tileSize * 0.7;
            
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (gridMap[r][c] === TILE.BLOCK_DESTRUCT) {
                        const bx = (c + 0.5) * tileSize;
                        const by = (r + 0.5) * tileSize;
                        if (Math.hypot(bullet.x - bx, bullet.y - by) < splashRadius) {
                            gridMap[r][c] = TILE.EMPTY;
                            createParticles(bx, by, '#a0aec0', 4);
                        }
                    }
                }
            }

            for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                const enemy = enemies[eIdx];
                if (Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < splashRadius + enemy.radius) {
                    enemy.hp--;
                    if (enemy.hp <= 0) {
                        createParticles(enemy.x, enemy.y, '#e53e3e', 14);
                        enemies.splice(eIdx, 1);
                        updateHUDEnemies();
                    }
                }
            }

            if (Math.hypot(bullet.x - player.x, bullet.y - player.y) < splashRadius + player.radius) {
                player.alive = false;
            }

            bullets.splice(index, 1);
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 50 + 15);
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    life: 0.2 + Math.random() * 0.2,
                    size: Math.random() * 2 + 2
                });
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gridMap || gridMap.length === 0) return;

            for (let r = 0; r < GRID_SIZE; r++) {
                if (!gridMap[r]) continue;
                for (let c = 0; c < GRID_SIZE; c++) {
                    const tile = gridMap[r][c];
                    const x = c * tileSize;
                    const y = r * tileSize;

                    if (tile === TILE.WALL_PERMANENT) {
                        ctx.fillStyle = isEXMode ? '#4c1d95' : '#4a5568';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.strokeStyle = isEXMode ? '#7c3aed' : '#718096';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
                    } else if (tile === TILE.BLOCK_DESTRUCT) {
                        ctx.fillStyle = isEXMode ? '#701a75' : '#9b2c2c';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.strokeStyle = isEXMode ? '#a21caf' : '#c53030';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x, y, tileSize, tileSize);
                    } else if (tile === TILE.ICE) {
                        ctx.fillStyle = '#63b3ed';
                        ctx.globalAlpha = 0.5;
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.globalAlpha = 1.0;
                    } else {
                        ctx.fillStyle = (r + c) % 2 === 0 ? (isEXMode ? '#0f0728' : '#111827') : (isEXMode ? '#1e1035' : '#1f2937');
                        ctx.fillRect(x, y, tileSize, tileSize);
                    }
                }
            }

            bullets.forEach(b => {
                ctx.save();
                ctx.fillStyle = b.isPlayer ? (isEXMode ? '#c084fc' : '#38bdf8') : '#f87171';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                if (b.lifeTimer > b.maxLife - 1.2) {
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                ctx.restore();
            });

            if (player.alive) {
                drawTank(player.x, player.y, player.angle, isEXMode ? '#8b5cf6' : '#38a169', isEXMode ? '#a78bfa' : '#48bb78');
            }

            enemies.forEach(enemy => {
                drawTank(enemy.x, enemy.y, enemy.turretAngle, enemy.color, '#f6ad55', enemy.isBoss);
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            });
        }

        function drawTank(x, y, turretAngle, bodyColor, turretColor, isBoss = false) {
            ctx.save();
            ctx.translate(x, y);

            const size = isBoss ? tileSize * 0.85 : tileSize * 0.65;

            ctx.fillStyle = '#111827';
            ctx.fillRect(-size / 2, -size / 2, size, size);

            ctx.fillStyle = bodyColor;
            ctx.fillRect(-size / 2 + 2, -size / 2 + 2, size - 4, size - 4);

            ctx.rotate(turretAngle);

            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(0, -3, size * 0.65, 6);

            ctx.fillStyle = turretColor;
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function setupControls() {
            document.getElementById('btn-start').onclick = () => {
                audio.init();
                audio.startBGM();
                loadStage(currentStage);
                gameState = 'PLAYING';
                hideAllOverlays();
            };

            document.getElementById('btn-select-normal').onclick = () => {
                audio.init();
                setEXMode(false);
            };
            document.getElementById('btn-select-ex').onclick = () => {
                audio.init();
                setEXMode(true);
            };

            document.getElementById('btn-stage-select-menu').onclick = () => {
                audio.init();
                buildStageSelectMenu();
                showOverlay('stage-overlay');
            };

            document.getElementById('btn-stage-back').onclick = () => {
                audio.init();
                showOverlay('title-overlay');
            };

            document.getElementById('btn-sound-toggle').onclick = (e) => {
                audio.init();
                audio.muted = !audio.muted;
                e.target.innerText = `SOUND: ${audio.muted ? 'OFF' : 'ON'}`;
                if (!audio.muted && gameState === 'PLAYING') {
                    audio.startBGM();
                } else if (audio.muted) {
                    audio.stopBGM();
                }
            };

            document.getElementById('btn-pause').onclick = () => {
                audio.init();
                if (gameState === 'PLAYING') {
                    gameState = 'PAUSED';
                    audio.stopBGM();
                    showOverlayWithMessage('PAUSED', 'GAME SUSPENDED', 'RESUME');
                } else if (gameState === 'PAUSED') {
                    gameState = 'PLAYING';
                    audio.startBGM();
                    hideAllOverlays();
                }
            };

            document.getElementById('btn-restart').onclick = () => {
                audio.init();
                if (gameState === 'PLAYING' || gameState === 'PAUSED' || gameState === 'GAME_OVER') {
                    loadStage(currentStage);
                    gameState = 'PLAYING';
                    audio.startBGM();
                    hideAllOverlays();
                }
            };

            window.addEventListener('keydown', (e) => {
                audio.init();
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            });

            const joyBase = document.getElementById('touch-joystick-base');
            const joyKnob = document.getElementById('touch-joystick-knob');
            let isDragging = false;
            let startX = 0;
            let startY = 0;

            const handleTouchStart = (clientX, clientY) => {
                audio.init();
                if (audio.ctx && audio.ctx.state === 'suspended') {
                    audio.ctx.resume();
                }
                if (gameState !== 'PLAYING') return;
                isDragging = true;
                startX = clientX;
                startY = clientY;

                const rect = canvas.getBoundingClientRect();
                const relativeX = clientX - rect.left;
                const relativeY = clientY - rect.top;

                joyBase.style.left = `${relativeX}px`;
                joyBase.style.top = `${relativeY}px`;
                joyBase.style.display = 'block';
                joyKnob.style.transform = `translate(-50%, -50%)`;
            };

            const handleTouchMove = (clientX, clientY) => {
                if (!isDragging) return;
                let dx = clientX - startX;
                let dy = clientY - startY;

                const maxRadius = 45;
                const distance = Math.hypot(dx, dy);

                if (distance > maxRadius) {
                    dx = (dx / distance) * maxRadius;
                    dy = (dy / distance) * maxRadius;
                }

                joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

                joystickVector.x = distance === 0 ? 0 : dx / maxRadius;
                joystickVector.y = distance === 0 ? 0 : dy / maxRadius;
            };

            const resetTouchJoystick = () => {
                isDragging = false;
                joyBase.style.display = 'none';
                joystickVector.x = 0;
                joystickVector.y = 0;
            };

            const container = document.getElementById('game-container');

            container.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                e.preventDefault();
                const touch = e.touches[0];
                handleTouchStart(touch.clientX, touch.clientY);
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                handleTouchMove(touch.clientX, touch.clientY);
            }, { passive: false });

            window.addEventListener('touchend', resetTouchJoystick);
            window.addEventListener('touchcancel', resetTouchJoystick);

            container.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                handleTouchStart(e.clientX, e.clientY);
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) handleTouchMove(e.clientX, e.clientY);
            });

            window.addEventListener('mouseup', resetTouchJoystick);
        }

        let lastTime = 0;
        function gameLoop(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function initGame() {
            gridMap = generateStageLayout(1);
            setupControls();
            buildStageSelectMenu();
            showOverlay('title-overlay');
            requestAnimationFrame((time) => {
                lastTime = time;
                gameLoop(time);
            });
        }

        window.onload = () => {
            initGame();
        };
    </script>
</body>
